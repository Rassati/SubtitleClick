<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SubtitleClick · Test fixture</title>
<style>
body{margin:0;padding:50px;background:#0b1014;color:#dae5e0;font-family:system-ui}h1{font-size:16px;font-weight:500}
#movie_player{position:relative;width:960px;height:540px;background:linear-gradient(130deg,#263b3b,#131c2b);overflow:hidden}
video{width:100%;height:100%}.scene{position:absolute;inset:60px;display:grid;place-items:center;color:#648b80;font-size:18px}
.caption-window{position:absolute;bottom:64px;left:180px;max-width:620px;text-align:center;font-size:24px;line-height:1.45;color:white;pointer-events:none}
.caption-visual-line{display:block}.ytp-caption-segment{background:#000b;padding:2px 5px}
.ytp-subtitles-button{position:absolute;bottom:14px;right:20px;background:#fff2;color:white;border:0;padding:8px}
</style></head><body>
<h1>SubtitleClick / cenário de teste do player</h1>
<div id="movie_player">
  <video class="html5-main-video"></video>
  <div class="scene">English, one sentence at a time.</div>
  <div class="ytp-caption-window-container">
    <div class="caption-window"><span class="caption-visual-line"><span class="ytp-caption-segment">The best way to learn is to keep going.</span></span></div>
  </div>
  <button class="ytp-subtitles-button" aria-pressed="true">CC</button>
</div>
</body></html>
